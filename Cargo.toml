[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# The web app only builds for wasm32; `cargo build` on the desktop skips it.
default-members = ["crates/*", "apps/aiassist", "xtask"]

[workspace.package]
# The only place the version lives. Change it with `cargo xtask version set X.Y.Z[-pre]`.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/cpCr4zy/AIAssist-rust"

[workspace.dependencies]
# internal
aiassist-core = { path = "crates/core", version = "0.1.0" }
aiassist-ui = { path = "crates/ui", version = "0.1.0" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# Local wall-clock time for log lines; `wasmbind` reads it from the browser.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

# network (desktop): HTTPS with the OS's root certificates, no webpki-roots (SPEC.md §4.3)
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"

# secrets (desktop): Windows Credential Manager, macOS Keychain, Secret Service on Linux/FreeBSD
keyring = "4"
zbus-secret-service-keyring-store = "1"

# web (wasm32)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# ui (each binary picks its eframe features: SPEC.md §4.2)
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"

# testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies (every non-workspace package) are optimised and keep only line tables, so debug
# builds stay fast and backtraces still show file and line without huge PDBs on Windows.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

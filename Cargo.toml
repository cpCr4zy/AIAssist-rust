[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# The web app only builds for wasm32; `cargo build` on the desktop skips it.
default-members = ["crates/*", "apps/aiassist", "xtask"]

[workspace.package]
# The only place the version lives. Change it with `cargo xtask version set X.Y.Z[-pre]`.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/cpCr4zy/AIAssist-rust"

[workspace.dependencies]
# internal
aiassist-core = { path = "crates/core", version = "0.1.0" }
aiassist-ui = { path = "crates/ui", version = "0.1.0" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"

# ui (each binary picks its eframe features: SPEC.md §4.2)
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

# testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies (every non-workspace package) are optimised and keep only line tables, so debug
# builds stay fast and backtraces still show file and line without huge PDBs on Windows.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

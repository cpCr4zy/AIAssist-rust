# cargo-deny policy: `cargo deny check` (CI job `deny`, part of `cargo xtask ci`).
# Permissive licences only; copyleft (GPL, AGPL, LGPL) is never linked.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font).
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies must be listed here and pinned by `rev` in Cargo.toml.
allow-git = []

[advisories]
yanked = "warn"
# Every ignored advisory needs a reason: { id = "RUSTSEC-YYYY-NNNN", reason = "..." }
ignore = []
